# Referința de schelet pentru modulul docker: compose cu healthcheck și depends_on.
# Verificat structural și cu `docker compose config`: katas/test_skel_docker.py.

# === s-docker-compose ===
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgres://postgres:dev@db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
# === end ===
