<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROTOTIP · Tabla cu trepte</title>
<!--
  PROTOTIP, de aruncat. Întrebarea: cum arată pe 360 px treapta evidențiată și cine arată spre ea
  (A om din linii, B robot rotund, C mână cu băț), în cele patru stări (vorbește, ascultă, se gândește, pauză).
  Variantele se schimbă cu ?variant=A|B|C sau din bara de jos. Schemele sunt cele reale, din src/desf/asyncio.md.
  Nu e legat de aplicație: totul e simulat în pagină, fără Jarvis, fără stare salvată.
  Codul rămâne pe ramura prototype/tabla-pasi; pagina din docs/ se șterge după alegere.
-->
<style>
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #e4e9f1; --ink: #141a27; --muted: #5b667c;
  --line: #d2d9e5; --line-strong: #a9b4c7; --accent: #2c4fd3; --on-accent: #ffffff; --accent-soft: #dce3fb;
  --ok: #1a7a4b; --ok-soft: #ddf2e6; --bad: #c2382d; --warn: #9a5800; --warn-soft: #fcebd2; --code-bg: #f3f5fa;
  --shadow: 0 1px 2px rgba(20,26,39,.06), 0 4px 14px rgba(20,26,39,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161c27; --surface-2: #1e2634; --ink: #e6eaf2; --muted: #9aa5ba;
    --line: #2a3445; --line-strong: #3e4b61; --accent: #8ea2ff; --on-accent: #0e121a; --accent-soft: #24305a;
    --ok: #55cf92; --ok-soft: #173326; --bad: #ff8a7e; --warn: #f3b54e; --warn-soft: #3a2c14; --code-bg: #121824;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161c27; --surface-2: #1e2634; --ink: #e6eaf2; --muted: #9aa5ba;
  --line: #2a3445; --line-strong: #3e4b61; --accent: #8ea2ff; --on-accent: #0e121a; --accent-soft: #24305a;
  --ok: #55cf92; --ok-soft: #173326; --bad: #ff8a7e; --warn: #f3b54e; --warn-soft: #3a2c14; --code-bg: #121824;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); padding: 12px 16px 150px; }
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.proto-tag { font: 700 11px/1 var(--font-mono); letter-spacing: .08em; color: #fff; background: #b4235a; border-radius: 6px; padding: 5px 8px; align-self: flex-start; }
.eyebrow { font: 600 11.5px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.timer { font: 600 13px/1 var(--font-mono); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.stage { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px 14px; min-height: 66px; }
.state { font: 700 17px/1.2 var(--font-display); }
.chip { font: 600 12.5px/1 var(--font-body); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 6px 10px; }
.pos { font: 700 15px/1 var(--font-mono); color: var(--accent); }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 10px 0; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 25%; }
.tip { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.btn { appearance: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 12px; font: 600 16px/1.1 var(--font-body); min-height: 56px; padding: 0 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); }
.ctl { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 6px; }
.mutes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* orbul de azi (folosit de C și ca referință) */
.orb { --c: var(--accent); width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 62%, color-mix(in srgb, var(--c) 72%, #000));
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 16%, transparent); }
.ph-speaking .orb { --c: var(--ok); animation: pulse 1.4s ease-in-out infinite; }
.ph-thinking .orb { --c: var(--warn); animation: pulse .9s ease-in-out infinite; }
.ph-paused .orb { --c: var(--line-strong); }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* tabla: cuvinte cheie și treptele schemei */
.kw { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.kw li { font-size: 20px; font-weight: 600; line-height: 1.3; padding: 2px 8px 2px 10px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; transition: opacity .35s, background .35s; }
.kw li.hid { display: none; }
.kw li.cur { background: var(--accent-soft); }
.kw li.old { opacity: .5; }
.schema { margin-top: 12px; position: relative; }
.step { font: 500 13px/1.45 var(--font-mono); padding: 5px 8px; border-radius: 8px; border-left: 3px solid transparent; transition: opacity .4s, background .4s, border-color .4s; overflow-wrap: anywhere; }
.step + .step { margin-top: 2px; }
.step .ln { display: block; }
.step .ar { color: var(--muted); }
.step .ar b { color: var(--accent); font-weight: 700; margin-right: 4px; }
.step.cur { background: var(--accent-soft); border-left-color: var(--accent); }
.step.fut { opacity: .38; }
.ph-paused .step.cur { background: var(--surface-2); border-left-color: var(--line-strong); }

/* A: omul din linii, în stânga tablei, urcă și coboară cu treapta */
.va .boardwrap { display: grid; grid-template-columns: 50px 1fr; gap: 4px; }
.va .figcol { position: relative; }
.va .fig { position: absolute; left: -4px; width: 56px; height: 96px; transition: top .55s cubic-bezier(.3,.9,.3,1); }
.fig .ink { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.fig .stick { stroke: var(--warn); stroke-width: 2.6; stroke-linecap: round; }
.fig .head { fill: var(--surface); }
.fig .arm { transform-origin: 20px 34px; transition: transform .45s; }
.ph-listening .fig .arm { transform: rotate(62deg); }
.ph-thinking .fig .arm { transform: rotate(-118deg); }
.ph-paused .fig .arm { transform: rotate(80deg); }
.ph-paused .fig .ink { stroke: var(--line-strong); }
.fig .mouth { transform-origin: 20px 17px; }
.ph-speaking .fig .mouth { animation: talk .32s ease-in-out infinite alternate; }
@keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1.5); } }
.fig .bub { opacity: 0; transition: opacity .3s; }
.ph-thinking .fig .bub-t, .ph-paused .fig .bub-p, .ph-listening .fig .bub-l { opacity: 1; }
.fig .bub text { font: 700 11px var(--font-mono); fill: var(--muted); }

/* B: robotul rotund stă sus, în locul orbului; arată treapta cu un punct laser pe marginea dreaptă */
.vb .stage { justify-content: flex-start; }
.robot { width: 64px; height: 64px; flex: none; }
.robot .face { fill: var(--accent); transition: fill .3s; }
.ph-speaking .robot .face { fill: var(--ok); }
.ph-thinking .robot .face { fill: var(--warn); }
.ph-paused .robot .face { fill: var(--line-strong); }
.robot .visor { fill: var(--surface); }
.robot .eye { fill: var(--ink); transition: transform .3s; transform-box: fill-box; transform-origin: center; }
.ph-thinking .robot .eye { transform: translate(2px, -3px); }
.ph-paused .robot .eye { transform: scaleY(.15); }
.robot .mb { fill: var(--ink); transform-box: fill-box; transform-origin: center; }
.ph-speaking .robot .mb { animation: eq .5s ease-in-out infinite alternate; }
.ph-speaking .robot .mb:nth-child(2) { animation-delay: .15s; }
.ph-speaking .robot .mb:nth-child(3) { animation-delay: .3s; }
@keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1.6); } }
.robot .ant { fill: var(--ink); }
.ph-listening .robot .ant { fill: var(--ok); }
.vb .schema { padding-right: 26px; }
.vb .laser { position: absolute; right: 0; width: 22px; height: 22px; transition: top .5s cubic-bezier(.3,.9,.3,1), opacity .3s; }
.vb .laser circle.c { fill: var(--accent); }
.vb .laser circle.r { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .5; transform-box: fill-box; transform-origin: center; animation: ring 1.2s ease-out infinite; }
.ph-speaking .vb .laser circle.c, .vb.ph-speaking .laser circle.c { fill: var(--ok); }
.vb.ph-speaking .laser circle.r { stroke: var(--ok); }
.vb.ph-paused .laser, .vb.ph-listening .laser { opacity: .35; }
.vb.ph-paused .laser circle.r { animation: none; }
@keyframes ring { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.4); opacity: 0; } }
.vb .rsay { font-size: 13px; color: var(--muted); line-height: 1.3; }

/* C: doar o mână cu băț, din marginea stângă a tablei; orbul de azi rămâne sus */
.vc .schema { padding-left: 34px; }
.vc .hand { position: absolute; left: -20px; width: 54px; height: 26px; transition: top .5s cubic-bezier(.3,.9,.3,1), transform .4s, opacity .3s; }
.vc .hand .sk { stroke: var(--warn); stroke-width: 3; stroke-linecap: round; }
.vc .hand .hd { fill: #e9b98f; stroke: #9a6a43; stroke-width: 1.2; }
.vc.ph-speaking .hand { animation: tap 1.6s ease-in-out infinite; }
.vc.ph-thinking .hand { transform: translateX(-10px); }
.vc.ph-listening .hand { transform: translateX(-14px); opacity: .6; }
.vc.ph-paused .hand { transform: translateX(-22px); opacity: .25; }
@keyframes tap { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }

/* panoul prototipului (nu face parte din design) */
.pp { border: 2px dashed #b4235a; border-radius: 12px; padding: 10px; font-size: 13px; display: grid; gap: 8px; }
.pp .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pp button, .pp select { font: 600 13px var(--font-body); border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 6px 9px; }
.pp button[aria-pressed="true"] { background: #b4235a; color: #fff; border-color: #b4235a; }
.pp .st { font: 12px/1.4 var(--font-mono); color: var(--muted); }
.switch { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 9; font: 600 14px var(--font-body); }
.switch button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 18px; }
.switch span { padding: 0 10px; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="switch"><button id="prev" aria-label="Varianta anterioară">←</button><span id="vlabel"></span><button id="next" aria-label="Varianta următoare">→</button></div>
<script>
const BOARDS = [{"n":1,"problema":["1.000 de conexiuni","un thread pe conexiune"],"ideea":["un singur thread","await cedează bucla"],"schema":"A rulează\n↓ await\nA se suspendă\n↓ bucla alege B\nB rulează\n↓ I/O gata\nbucla reia A"},{"n":2,"problema":["apel blocant","fără await"],"ideea":["to_thread","executor implicit"],"schema":"await to_thread(f)\n↓ f pleacă într-un thread\nbucla rulează alte task-uri\n↓ f termină\ncorutina își reia locul"},{"n":3,"problema":["gather","500 la un API"],"ideea":["prima excepție","restul merg"],"schema":"gather(a, b, c)\n↓ b ridică KeyError\nawait gather → KeyError\na și c rulează mai departe\n↓ nimeni nu le mai așteaptă\nrezultatele se pierd"},{"n":4,"problema":["gather fără anulare"],"ideea":["TaskGroup 3.11+","ExceptionGroup"],"schema":"async with TaskGroup() as tg\n↓ tg.create_task × 3\ntask 2 ridică KeyError\n↓ grupul anulează 1 și 3\nExceptionGroup\n↓ except*"},{"n":5,"problema":["API terț blocat"],"ideea":["asyncio.timeout","wait_for"],"schema":"timeout(5): bloc\n↓ trec 5 s\nbucla anulează task-ul\n↓ CancelledError în bloc\nla ieșire: TimeoutError"},{"n":6,"problema":["worker care ignoră cancel"],"ideea":["CancelledError","BaseException"],"schema":"task.cancel()\n↓ la următorul await\nCancelledError în task\n↓ except BaseException\nreturn 1: anulare înghițită\n↓\nwait_for întoarce 1"},{"n":7,"problema":["50.000 de apeluri","limită 20"],"ideea":["Semaphore","Queue + workeri"],"schema":"Semaphore(2): contor 2\n↓ A intră: contor 1\n↓ B intră: contor 0\nC așteaptă la async with\n↓ A iese: contor 1\nC intră: contor 0"},{"n":8,"problema":["task uitat"],"ideea":["referință slabă","GC"],"schema":"create_task(f())\n↓ fără altă referință\nbucla ține doar una slabă\n↓ GC\ntask dispărut, eroare mută\n↓ cu set + discard\ntask ținut în viață"},{"n":9,"problema":["thread străin"],"ideea":["call_soon_threadsafe","run_coroutine_threadsafe"],"schema":"thread străin\n↓ run_coroutine_threadsafe\nbucla primește corutina\n↓ o rulează pe thread-ul ei\nconcurrent Future\n↓ .result() în thread străin"}];
const VARIANTS = { A: "om din linii", B: "robot rotund", C: "mână cu băț" };
const STATE_TXT = { speaking: "Vorbește", listening: "Te ascultă", thinking: "Se gândește", paused: "Pauză" };
const SPEAK_MS = 4200, STEP_GAP_MS = 2000, THINK_MS = 900, WINDOW_MS = 3000, KW_MS = 1300;

const qs = new URLSearchParams(location.search);
const S = { variant: VARIANTS[qs.get("variant")] ? qs.get("variant") : "A", b: 0, step: 0, kw: 0, phase: "thinking", auto: true, theme: null };
let timer = null, t0 = Date.now();

// Treptele: prima e ce stă înainte de prima săgeată; fiecare rând „↓ …” începe o treaptă nouă și ia rândurile fără săgeată de după el.
function trepte(schema) {
  const out = [];
  for (const ln of schema.split("\n")) {
    if (ln.startsWith("↓") || !out.length) out.push([ln]); else out[out.length - 1].push(ln);
  }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lineHtml = ln => ln.startsWith("↓") ? '<span class="ln ar"><b>↓</b>' + esc(ln.slice(1).trim()) + "</span>" : '<span class="ln">' + esc(ln) + "</span>";

function figA() {
  return '<svg class="fig" id="ptr" viewBox="0 0 56 96" aria-hidden="true">'
    + '<g class="bub bub-t"><text x="30" y="9">…</text></g><g class="bub bub-p"><text x="30" y="9">II</text></g><g class="bub bub-l"><text x="30" y="9">?</text></g>'
    + '<circle class="ink head" cx="20" cy="16" r="9"/><circle cx="17" cy="14" r="1.3" fill="currentColor"/><circle cx="23" cy="14" r="1.3" fill="currentColor"/>'
    + '<line class="ink mouth" x1="17" y1="19" x2="23" y2="19"/>'
    + '<line class="ink" x1="20" y1="25" x2="20" y2="60"/><line class="ink" x1="20" y1="60" x2="11" y2="88"/><line class="ink" x1="20" y1="60" x2="29" y2="88"/>'
    + '<line class="ink" x1="20" y1="36" x2="10" y2="52"/>'
    + '<g class="arm"><line class="ink" x1="20" y1="34" x2="36" y2="34"/><line class="stick" x1="36" y1="34" x2="56" y2="34"/></g></svg>';
}
function robotB() {
  return '<svg class="robot" viewBox="0 0 64 64" aria-hidden="true"><rect class="ant" x="30" y="2" width="4" height="9" rx="2"/><circle class="ant" cx="32" cy="4" r="4"/>'
    + '<circle class="face" cx="32" cy="36" r="26"/><rect class="visor" x="14" y="24" width="36" height="16" rx="8"/>'
    + '<circle class="eye" cx="24" cy="32" r="3.6"/><circle class="eye" cx="40" cy="32" r="3.6"/>'
    + '<g><rect class="mb" x="25" y="46" width="3" height="6" rx="1.5"/><rect class="mb" x="30.5" y="46" width="3" height="6" rx="1.5"/><rect class="mb" x="36" y="46" width="3" height="6" rx="1.5"/></g></svg>';
}
function laserB() { return '<svg class="laser" id="ptr" viewBox="0 0 22 22" aria-hidden="true"><circle class="r" cx="11" cy="11" r="8"/><circle class="c" cx="11" cy="11" r="5"/></svg>'; }
function handC() {
  return '<svg class="hand" id="ptr" viewBox="0 0 54 26" aria-hidden="true"><line class="sk" x1="18" y1="13" x2="52" y2="13"/>'
    + '<path class="hd" d="M2 7 h12 q6 0 6 6 q0 6 -6 6 h-12 z"/><path class="hd" d="M12 9 q5 -1 6 2" fill="none"/></svg>';
}

function render() {
  const B = BOARDS[S.b], T = trepte(B.schema), v = S.variant.toLowerCase();
  if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme;
  const kws = B.ideea.map((w, i) => '<li class="' + (i >= S.kw ? "hid" : i === S.kw - 1 && S.step === 0 && S.kwLive ? "cur" : "old") + '">' + esc(w) + "</li>").join("");
  const steps = T.map((g, i) => '<div class="step ' + (i < S.step ? "past" : i === S.step && !S.kwLive ? "cur" : "fut") + '" data-i="' + i + '">' + g.map(lineHtml).join("") + "</div>").join("");
  const stageInner = S.variant === "B"
    ? robotB() + '<div><div class="state">' + STATE_TXT[S.phase] + '</div><div class="rsay">Jarvis · arată pe tablă</div></div>'
    : S.variant === "A" ? '<div class="state">' + STATE_TXT[S.phase] + "</div>"
    : '<div class="orb"></div><div class="state">' + STATE_TXT[S.phase] + "</div>";
  const schema = '<div class="schema" id="schema">' + (S.variant === "B" ? laserB() : S.variant === "C" ? handC() : "") + steps + "</div>";
  const board = '<ul class="kw">' + kws + "</ul>" + (S.variant === "A" ? '<div class="boardwrap"><div class="figcol">' + figA() + "</div>" + schema + "</div>" : schema);
  const el = s => Math.round((Date.now() - t0) / 1000);
  document.getElementById("app").className = "v" + v + " ph-" + S.phase;
  document.getElementById("app").innerHTML =
    '<span class="proto-tag">PROTOTIP · nu e aplicația</span>'
    + '<div class="spread"><div class="eyebrow">Jarvis · Lecție · Asyncio</div><span class="timer">' + String(Math.floor(el() / 60)).padStart(2, "0") + ":" + String(el() % 60).padStart(2, "0") + "</span></div>"
    + '<section class="card stage">' + stageInner + "</section>"
    + '<article class="card"><div class="spread"><span class="chip">Asyncio</span><span class="pos">' + B.n + "/12</span></div><div class=\"bar\"><span style=\"width:" + Math.round(B.n / 12 * 100) + '%"></span></div>'
    + '<div class="tip">Ideea · treapta ' + (S.step + 1) + "/" + T.length + "</div>" + board + "</article>"
    + '<div class="ctl"><button class="btn primary" data-a="pause">' + (S.phase === "paused" ? "Reia" : "Pauză") + '</button><button class="btn" data-a="repeat">Repetă</button><button class="btn" data-a="skip">Sari</button><button class="btn">Reset</button></div>'
    + '<div class="mutes"><button class="btn">Mut</button><button class="btn danger">Gata</button></div>'
    + '<section class="pp" aria-label="Comenzile prototipului"><b>Comenzile prototipului</b>'
    + '<div class="row">Schema: <select id="sel">' + BOARDS.map((x, i) => '<option value="' + i + '"' + (i === S.b ? " selected" : "") + ">punctul " + x.n + " · " + esc(x.schema.split("\n")[0]) + "</option>").join("") + "</select></div>"
    + '<div class="row">Stare: ' + Object.keys(STATE_TXT).map(k => '<button data-ph="' + k + '" aria-pressed="' + (S.phase === k) + '">' + STATE_TXT[k] + "</button>").join("") + "</div>"
    + '<div class="row"><button data-a="auto" aria-pressed="' + S.auto + '">Redare automată</button><button data-a="step">Treapta următoare</button><button data-a="theme">Temă: ' + (S.theme || "sistem") + "</button></div>"
    + '<div class="st">varianta ' + S.variant + " · schema " + (S.b + 1) + "/" + BOARDS.length + " · treapta " + (S.step + 1) + "/" + T.length + " · faza " + S.phase + " · cuvinte " + S.kw + "/" + B.ideea.length + " · pauză între trepte " + STEP_GAP_MS / 1000 + " s</div></section>";
  place();
  document.getElementById("vlabel").textContent = S.variant + " (" + VARIANTS[S.variant] + ")";
}
// Indicatorul (om, laser sau mână) se mută la mijlocul treptei curente.
function place() {
  const p = document.getElementById("ptr"), sc = document.getElementById("schema"); if (!p || !sc) return;
  const cur = sc.querySelector(".step.cur") || sc.querySelector(".step.fut") || sc.querySelector(".step");
  const mid = cur.offsetTop + cur.offsetHeight / 2;
  if (S.variant === "A") { p.style.top = Math.max(0, mid - 34) + "px"; sc.parentElement.style.minHeight = (mid + 64) + "px"; }
  else p.style.top = (mid - p.getBoundingClientRect().height / 2) + "px";
}

// Simularea: se gândește → vorbește (la prima treaptă apar întâi cuvintele cheie) → pauză între trepte → … → fereastra de ascultare → schema următoare.
function clear() { clearTimeout(timer); timer = null; }
function go(ph, ms, then) { S.phase = ph; render(); clear(); if (S.auto && ms != null) timer = setTimeout(then, ms); }
function think() { go("thinking", THINK_MS, speak); }
function speak() {
  const B = BOARDS[S.b];
  if (S.step === 0 && S.kw < B.ideea.length) { S.kwLive = true; S.kw++; return go("speaking", KW_MS, speak); }
  S.kwLive = false;
  go("speaking", SPEAK_MS, afterStep);
}
function afterStep() {
  const T = trepte(BOARDS[S.b].schema);
  if (S.step < T.length - 1) return go("thinking", STEP_GAP_MS, () => { S.step++; think(); });
  go("listening", WINDOW_MS, () => { S.b = (S.b + 1) % BOARDS.length; S.step = 0; S.kw = 0; think(); });
}
function restart() { S.step = 0; S.kw = 0; S.kwLive = false; think(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a],[data-ph],#prev,#next"); if (!t) return;
  const a = t.dataset.a, keys = Object.keys(VARIANTS);
  if (t.id === "prev" || t.id === "next") { const i = keys.indexOf(S.variant); setVariant(keys[(i + (t.id === "next" ? 1 : keys.length - 1)) % keys.length]); return; }
  if (t.dataset.ph) { S.auto = false; clear(); S.kwLive = false; S.kw = BOARDS[S.b].ideea.length; S.phase = t.dataset.ph; render(); return; }
  if (a === "pause") { if (S.phase === "paused") { S.auto = true; think(); } else { clear(); S.phase = "paused"; render(); } }
  else if (a === "repeat") { S.auto = true; restart(); }
  else if (a === "skip") { S.auto = true; S.b = (S.b + 1) % BOARDS.length; restart(); }
  else if (a === "auto") { S.auto = !S.auto; if (S.auto) think(); else { clear(); render(); } }
  else if (a === "step") { const T = trepte(BOARDS[S.b].schema); S.kw = BOARDS[S.b].ideea.length; S.kwLive = false; S.step = (S.step + 1) % T.length; if (S.auto) think(); else render(); }
  else if (a === "theme") { S.theme = S.theme === null ? "dark" : S.theme === "dark" ? "light" : null; render(); }
});
document.addEventListener("change", e => { if (e.target.id === "sel") { S.b = +e.target.value; S.auto = true; restart(); } });
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  const keys = Object.keys(VARIANTS), i = keys.indexOf(S.variant);
  if (e.key === "ArrowRight") setVariant(keys[(i + 1) % keys.length]);
  if (e.key === "ArrowLeft") setVariant(keys[(i + keys.length - 1) % keys.length]);
});
function setVariant(v) { S.variant = v; const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); render(); }
window.addEventListener("resize", place);
setInterval(() => { const t = document.querySelector(".timer"); if (t) { const s = Math.round((Date.now() - t0) / 1000); t.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); } }, 1000);
// Pentru capturi: ?b=<schema>&step=<treapta>&ph=<faza>&theme=dark oprește redarea automată.
if (qs.has("ph")) { S.auto = false; S.b = +(qs.get("b") || 0); S.step = +(qs.get("step") || 0); S.kw = BOARDS[S.b].ideea.length; S.phase = qs.get("ph"); S.theme = qs.get("theme"); render(); }
else think();
</script>
</body>
</html>
